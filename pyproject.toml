[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xcpredict"
version = "0.1.0"
description = "Start-list-aware prediction of FIS Cross-Country World Cup results"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Nathaniel Knapp" }]
keywords = ["cross-country skiing", "FIS", "world cup", "elo", "sports prediction"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
xcpredict = "xcpredict.cli:main"

[project.urls]
Homepage = "https://github.com/deknapp/xcpredict"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xcpredict = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
